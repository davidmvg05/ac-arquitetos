<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 900" width="100%" height="100%">
  <defs>
    <!-- 20px fine drafting grid pattern -->
    <pattern id="grid-fine" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#000000" stroke-opacity="0.035" stroke-width="0.5" />
    </pattern>
    <!-- 100px major drafting grid pattern -->
    <pattern id="grid-major" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#grid-fine)" />
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#000000" stroke-opacity="0.075" stroke-width="0.8" />
    </pattern>
  </defs>

  <!-- Drafting Sheet Paper Background -->
  <rect width="100%" height="100%" fill="#ffffff" />
  <rect width="100%" height="100%" fill="url(#grid-major)" />

  <!-- Outer Technical Esquadria Border -->
  <rect x="16" y="16" width="1888" height="868" fill="none" stroke="#000000" stroke-opacity="0.35" stroke-width="1.5" />
  <rect x="24" y="24" width="1872" height="852" fill="none" stroke="#000000" stroke-opacity="0.2" stroke-width="0.8" />

  <!-- Corner Registration Crosses -->
  <path d="M 14 24 L 34 24 M 24 14 L 24 34" stroke="#000000" stroke-opacity="0.5" stroke-width="1.2" />
  <path d="M 1886 24 L 1906 24 M 1896 14 L 1896 34" stroke="#000000" stroke-opacity="0.5" stroke-width="1.2" />
  <path d="M 14 876 L 34 876 M 24 866 L 24 886" stroke="#000000" stroke-opacity="0.5" stroke-width="1.2" />
  <path d="M 1886 876 L 1906 876 M 1896 866 L 1896 886" stroke="#000000" stroke-opacity="0.5" stroke-width="1.2" />

  <!-- Centering Triangles (Sheet Midpoints) -->
  <polygon points="960,16 955,6 965,6" fill="#000000" fill-opacity="0.4" />
  <polygon points="960,884 955,894 965,894" fill="#000000" fill-opacity="0.4" />
  <polygon points="16,450 6,445 6,455" fill="#000000" fill-opacity="0.4" />
  <polygon points="1904,450 1914,445 1914,455" fill="#000000" fill-opacity="0.4" />

  <!-- Coordinate Labels (Margins) -->
  <g font-family="monospace" font-size="8.5" fill="#000000" fill-opacity="0.4" text-anchor="middle">
    <!-- Top Numbers -->
    <text x="160" y="12">01</text>
    <text x="320" y="12">02</text>
    <text x="480" y="12">03</text>
    <text x="640" y="12">04</text>
    <text x="800" y="12">05</text>
    <text x="960" y="12">06</text>
    <text x="1120" y="12">07</text>
    <text x="1280" y="12">08</text>
    <text x="1440" y="12">09</text>
    <text x="1600" y="12">10</text>
    <text x="1760" y="12">11</text>

    <!-- Bottom Numbers -->
    <text x="160" y="894">01</text>
    <text x="320" y="894">02</text>
    <text x="480" y="894">03</text>
    <text x="640" y="894">04</text>
    <text x="800" y="894">05</text>
    <text x="960" y="894">06</text>
    <text x="1120" y="894">07</text>
    <text x="1280" y="894">08</text>
    <text x="1440" y="894">09</text>
    <text x="1600" y="894">10</text>
    <text x="1760" y="894">11</text>

    <!-- Left Letters -->
    <text x="10" y="150">A</text>
    <text x="10" y="300">B</text>
    <text x="10" y="450">C</text>
    <text x="10" y="600">D</text>
    <text x="10" y="750">E</text>

    <!-- Right Letters -->
    <text x="1910" y="150">A</text>
    <text x="1910" y="300">B</text>
    <text x="1910" y="450">C</text>
    <text x="1910" y="600">D</text>
    <text x="1910" y="750">E</text>
  </g>

  <!-- Architectural Project Drawing Layer -->
  <g id="architectural-project-drawing">
    <!-- Structural Grid Axes (Linhas de Eixo Traço-Ponto) -->
    <g stroke="#000000" stroke-opacity="0.1" stroke-width="0.8" stroke-dasharray="16,3,2,3">
      <line x1="680" y1="40" x2="680" y2="820" />
      <line x1="920" y1="40" x2="920" y2="820" />
      <line x1="1160" y1="40" x2="1160" y2="820" />
      <line x1="1400" y1="40" x2="1400" y2="820" />
      <line x1="1640" y1="40" x2="1640" y2="820" />

      <line x1="600" y1="120" x2="1820" y2="120" />
      <line x1="600" y1="320" x2="1820" y2="320" />
      <line x1="600" y1="540" x2="1820" y2="540" />
      <line x1="600" y1="740" x2="1820" y2="740" />
    </g>

    <!-- Exterior Thick Walls (Alvenarias Estruturais em Betão) -->
    <g stroke="#000000" stroke-opacity="0.22" stroke-width="2.5" fill="none" stroke-linejoin="miter">
      <!-- Main pavilion volume -->
      <path d="M 680 120 L 1400 120 L 1400 320 L 1640 320 L 1640 540 L 1400 540 L 1400 740 L 920 740 L 920 540 L 680 540 Z" />
      <!-- Central Interior Courtyard (Pátio Interior com espelho de água) -->
      <path d="M 920 200 L 1160 200 L 1160 420 L 920 420 Z" />
      <!-- Swimming pool / Espelho de água outline -->
      <rect x="940" y="220" width="200" height="180" stroke-width="1.2" stroke-dasharray="0" stroke-opacity="0.15" />
    </g>

    <!-- Interior Partition Walls (Paredes Interiores) -->
    <g stroke="#000000" stroke-opacity="0.16" stroke-width="1.4" fill="none">
      <line x1="680" y1="320" x2="920" y2="320" />
      <line x1="780" y1="120" x2="780" y2="320" />
      <line x1="1160" y1="320" x2="1400" y2="320" />
      <line x1="1280" y1="320" x2="1280" y2="540" />
      <line x1="1400" y1="420" x2="1640" y2="420" />
      <line x1="1040" y1="540" x2="1040" y2="740" />
    </g>

    <!-- Glazed Facades e Sliding Window Lines (Caixilharia de Vidro) -->
    <g stroke="#000000" stroke-opacity="0.15" stroke-width="0.8" fill="none">
      <line x1="700" y1="117" x2="880" y2="117" />
      <line x1="700" y1="123" x2="880" y2="123" />
      <line x1="1200" y1="117" x2="1380" y2="117" />
      <line x1="1200" y1="123" x2="1380" y2="123" />
      <line x1="930" y1="197" x2="1150" y2="197" />
      <line x1="930" y1="203" x2="1150" y2="203" />
      <line x1="1410" y1="327" x2="1630" y2="327" />
      <line x1="1410" y1="333" x2="1630" y2="333" />
    </g>

    <!-- Door Swing Arcs (Arcos de Raio de Portas a 90°) -->
    <g stroke="#000000" stroke-opacity="0.2" stroke-width="1" fill="none" stroke-dasharray="3,3">
      <path d="M 780 240 A 50 50 0 0 1 830 290" />
      <path d="M 1280 430 A 50 50 0 0 1 1230 480" />
      <path d="M 920 480 A 55 55 0 0 1 975 535" />
      <path d="M 1400 470 A 50 50 0 0 1 1450 520" />
    </g>

    <!-- Concrete Structural Pillars (Pilares) -->
    <g fill="#000000" fill-opacity="0.15">
      <rect x="674" y="114" width="12" height="12" />
      <rect x="914" y="114" width="12" height="12" />
      <rect x="1154" y="114" width="12" height="12" />
      <rect x="1394" y="114" width="12" height="12" />
      <rect x="674" y="314" width="12" height="12" />
      <rect x="1394" y="314" width="12" height="12" />
      <rect x="1634" y="314" width="12" height="12" />
      <rect x="674" y="534" width="12" height="12" />
      <rect x="914" y="534" width="12" height="12" />
      <rect x="1394" y="534" width="12" height="12" />
      <rect x="1634" y="534" width="12" height="12" />
      <rect x="914" y="734" width="12" height="12" />
      <rect x="1394" y="734" width="12" height="12" />
    </g>

    <!-- Dimension Lines with Architectural Cotas (Linhas de Cota em Terracota) -->
    <g stroke="#7B4744" stroke-opacity="0.35" stroke-width="0.85" fill="none">
      <!-- Top Dimension Line -->
      <line x1="680" y1="80" x2="1400" y2="80" />
      <line x1="673" y1="73" x2="687" y2="87" />
      <line x1="913" y1="73" x2="927" y2="87" />
      <line x1="1153" y1="73" x2="1167" y2="87" />
      <line x1="1393" y1="73" x2="1407" y2="87" />

      <!-- Left Dimension Line -->
      <line x1="630" y1="120" x2="630" y2="540" />
      <line x1="623" y1="113" x2="637" y2="127" />
      <line x1="623" y1="313" x2="637" y2="327" />
      <line x1="623" y1="533" x2="637" y2="547" />

      <!-- Bottom Extension Dimension Line -->
      <line x1="920" y1="780" x2="1400" y2="780" />
      <line x1="913" y1="773" x2="927" y2="787" />
      <line x1="1153" y1="773" x2="1167" y2="787" />
      <line x1="1393" y1="773" x2="1407" y2="787" />
    </g>

    <!-- Dimension Numbers (Cotas Métricas) -->
    <g font-family="monospace" font-size="9" fill="#7B4744" fill-opacity="0.5" text-anchor="middle">
      <text x="800" y="74">6.00</text>
      <text x="1040" y="74">6.00</text>
      <text x="1280" y="74">6.00</text>
      <text x="618" y="225" transform="rotate(-90 618 225)">5.20</text>
      <text x="618" y="435" transform="rotate(-90 618 435)">5.60</text>
      <text x="1040" y="795">6.00</text>
      <text x="1280" y="795">6.00</text>
    </g>

    <!-- Technical Level Markers (Símbolos de Cota de Nível) -->
    <g font-family="monospace" font-size="8" fill="#000000" fill-opacity="0.32">
      <text x="710" y="180">▽ +0.00 N.P. (SALA)</text>
      <text x="980" y="300">▽ -0.20 N.P. (PÁTIO)</text>
      <text x="1200" y="180">▽ +0.00 N.P. (ATELIER)</text>
      <text x="1440" y="380">▽ +0.00 N.P. (GALERIA)</text>
      <text x="1100" y="650">▽ +0.00 N.P. (SUITE)</text>
    </g>

    <!-- Section Cut Line (Linha de Corte A-A') -->
    <g stroke="#000000" stroke-opacity="0.25" stroke-width="1.2" fill="none">
      <line x1="560" y1="230" x2="1720" y2="230" stroke-dasharray="24,6,3,6" />
      <polygon points="560,230 575,223 575,237" fill="#000000" fill-opacity="0.35" stroke="none" />
      <polygon points="1720,230 1705,223 1705,237" fill="#000000" fill-opacity="0.35" stroke="none" />
      <text x="545" y="234" font-family="monospace" font-size="12" font-weight="bold" fill="#000000" fill-opacity="0.4" text-anchor="end">A</text>
      <text x="1735" y="234" font-family="monospace" font-size="12" font-weight="bold" fill="#000000" fill-opacity="0.4">A'</text>
    </g>

    <!-- North Orientation Compass Rose (Rosa dos Ventos Técnica) -->
    <g transform="translate(1780, 110)" stroke="#000000" stroke-opacity="0.3" fill="none">
      <circle cx="0" cy="0" r="24" stroke-width="0.8" />
      <circle cx="0" cy="0" r="20" stroke-width="0.5" stroke-dasharray="2,2" />
      <line x1="0" y1="-32" x2="0" y2="32" stroke-width="0.8" />
      <line x1="-32" y1="0" x2="32" y2="0" stroke-width="0.8" />
      <polygon points="0,-24 5,-8 0,-2 -5,-8" fill="#000000" fill-opacity="0.35" stroke="none" />
      <text x="0" y="-38" font-family="monospace" font-size="11" font-weight="bold" fill="#000000" fill-opacity="0.45" text-anchor="middle" stroke="none">N</text>
    </g>


  </g>
</svg>
